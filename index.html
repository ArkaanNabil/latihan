<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan</title>
<meta name="description" content="Checklist latihan gym: kategori, sub-kategori, alat, set, repetisi, tutorial & preview. Offline, data tersimpan di HP.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Latihan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#E7E9EC; --ink:#121417; --muted:#666D76; --line:#DDE0E4;
  --done:#1E9E5A; --done-ink:#FFFFFF; --done-soft:#DDF3E6; --tut:#C62D24; --tut-bg:#FBE4E2;
  --danger:#D23B2E; --danger-soft:#FBE3E0;
  --shadow:0 1px 2px rgb(16 18 22 / .06),0 4px 16px rgb(16 18 22 / .06);
  /* warna piringan beban (standar IWF): merah 25, biru 20, kuning 15, hijau 10, putih 5, hitam */
  --p-red:#D6322B; --p-blue:#2463D1; --p-yellow:#E0A800; --p-green:#1F8F4E; --p-white:#8A9099; --p-black:#2B2F35;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1012; --surface:#181B1F; --sunk:#22262B; --ink:#EEF0F2; --muted:#9AA1AA; --line:#2A2F35;
    --done:#3CCB7F; --done-ink:#062312; --done-soft:#143322; --tut:#FF8A80; --tut-bg:#3A1C1A;
    --danger:#FF6B5E; --danger-soft:#3A1916;
    --shadow:none; --p-white:#C9CDD2; --p-black:#5A616B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1012; --surface:#181B1F; --sunk:#22262B; --ink:#EEF0F2; --muted:#9AA1AA; --line:#2A2F35;
  --done:#3CCB7F; --done-ink:#062312; --done-soft:#143322; --tut:#FF8A80; --tut-bg:#3A1C1A;
  --danger:#FF6B5E; --danger-soft:#3A1916;
  --shadow:none; --p-white:#C9CDD2; --p-black:#5A616B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--c,#2463D1);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:14px;min-height:100%}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--round);font-size:30px;font-weight:800;letter-spacing:-.02em}
.top .date{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 14px;background:var(--surface);box-shadow:var(--shadow);font-weight:650;font-size:15px;scroll-snap-align:start;white-space:nowrap}
.chip .plate{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgb(0 0 0 / .18)}
.chip .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--c);color:var(--ci,#fff)}
.chip[aria-selected="true"] .plate{background:var(--ci,#fff)}
.chip[aria-selected="true"] .cnt{color:var(--ci,#fff);opacity:.8}
.chip.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--muted)}

.hero{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ring{--p:0;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1turn),var(--sunk) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;font-family:var(--round)}
.hero .info{flex:1;min-width:0}
.hero h2{margin:0;font-family:var(--round);font-size:22px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* filter */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fsel{position:relative;flex:1 1 140px;min-width:0}
.fsel select{appearance:none;-webkit-appearance:none;width:100%;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:10px 34px 10px 36px;font-size:15px;font-weight:650;color:var(--ink);text-overflow:ellipsis}
.fsel select.on{background:var(--c);color:var(--ci,#fff)}
.fsel svg{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none;color:var(--muted)}
.fsel svg.l{left:11px} .fsel svg.r{right:10px}
.fsel select.on ~ svg{color:var(--ci,#fff)}
.clearf{border:0;background:transparent;color:var(--muted);font-weight:650;font-size:14px;padding:8px 4px}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:8px 4px -2px;font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.group-h b{color:var(--ink)}
.ex{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;transition:opacity .2s}
.ex.is-done{opacity:.72}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.6);transition:all .15s}
.ex.is-done .check{background:var(--done);border-color:var(--done)}
.ex.is-done .check svg{opacity:1;transform:none;color:var(--done-ink)}
.ex .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ex .name{font-weight:700;font-size:17px;line-height:1.25;word-break:break-word}
.ex.is-done .name{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--muted)}
.ex .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex .meta b{color:var(--ink);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.sub{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}
.ex .note{font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.thumb{position:relative;flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--sunk);display:grid;place-items:center}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:rgb(0 0 0 / .6);color:#fff;display:grid;place-items:center}
.thumb .badge svg{width:11px;height:11px;margin-left:1px}
.thumb .ph{color:var(--muted)} .thumb .ph svg{width:24px;height:24px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.set{min-width:38px;height:38px;border-radius:12px;border:0;background:var(--sunk);font-weight:750;font-size:14px;font-variant-numeric:tabular-nums;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:4px}
.set.on{background:var(--done);color:var(--done-ink)}
.set small{font-weight:600;opacity:.75;font-size:11px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px;background:var(--sunk);font-size:14px;font-weight:650;color:var(--ink);text-decoration:none;max-width:100%}
.pill svg{width:16px;height:16px;flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.tut{background:var(--tut-bg);color:var(--tut)}
.editbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.editbtn svg{width:20px;height:20px}
.order{display:flex;flex-direction:column;gap:4px}
.order button{width:34px;height:30px;border-radius:10px;border:0;background:var(--sunk);display:grid;place-items:center}
.order button:disabled{opacity:.3}
.order svg{width:16px;height:16px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:17px}

.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;pointer-events:none}
.bottom .inner{max-width:608px;width:100%;display:flex;gap:10px;pointer-events:auto}
.btn{flex:1;border:0;border-radius:16px;padding:15px 12px;white-space:nowrap;font-weight:750;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--c,#2463D1);color:var(--ci,#fff)}
.btn.finish{background:var(--done);color:var(--done-ink)}
.btn.soft{background:var(--sunk)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.small{flex:none;padding:10px 14px;font-size:15px;border-radius:12px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-family:var(--round);font-size:21px;font-weight:800}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.flabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select,.inp{width:100%;border:0;border-radius:12px;background:var(--sunk);padding:12px 14px;font-size:17px;min-width:0}
.field select{appearance:none;-webkit-appearance:none}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.withadd{display:flex;gap:6px}
.withadd select{flex:1}
.withadd .plus{flex:none;width:46px;border:0;border-radius:12px;background:var(--sunk);font-size:22px;font-weight:600}
.quick{display:flex;gap:6px}
.quick input{flex:1}
.stepper{display:flex;align-items:center;background:var(--sunk);border-radius:12px;overflow:hidden}
.stepper button{width:40px;height:46px;border:0;background:transparent;font-size:22px;font-weight:600;flex:none}
.stepper input{background:transparent!important;text-align:center;padding:12px 0!important;font-weight:750;font-variant-numeric:tabular-nums;border-radius:0!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.mprev{border-radius:14px;overflow:hidden;background:var(--sunk);aspect-ratio:16/10;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:0;position:relative;max-width:100%}
.mprev img,.mprev video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.mprev .note{padding:16px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:0;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 0 0 4px rgb(255 255 255 / .18)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.swatch small{color:#fff;font-size:11px;font-weight:800}
.err{color:var(--danger);font-size:14px;margin:0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;overflow:hidden}
.menu button{border:0;background:transparent;text-align:left;padding:14px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu button svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu button .sub{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.menu button.danger{color:var(--danger)} .menu button.danger svg{color:var(--danger)}
.menu button.armed{background:var(--danger);color:#fff} .menu button.armed svg{color:#fff}
.section-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist li:first-child{border-top:0}
.hist .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* master table editor */
.mt-group{margin-top:14px}
.mt-group h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.mt-group h4 .plate{width:12px;height:12px;border-radius:50%;background:var(--c)}
.mt-rows{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;overflow:hidden}
.mt-row{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-top:1px solid var(--line)}
.mt-row:first-child{border-top:0}
.mt-row input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;padding:8px 0}
.mt-row .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.mt-row .del{border:0;background:transparent;color:var(--danger);font-weight:700;font-size:13px;padding:8px 10px;border-radius:10px;white-space:nowrap}
.mt-row .del.armed{background:var(--danger);color:#fff}
.mt-row .mv{border:0;background:transparent;color:var(--muted);width:28px;height:32px;display:grid;place-items:center;padding:0}
.mt-row .mv svg{width:16px;height:16px}
.mt-row .mv:disabled{opacity:.25}
.mt-add{display:flex;gap:6px;margin-top:8px}
.mt-add input{flex:1}
.mt-empty{padding:12px;color:var(--muted);font-size:14px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lb .media{max-width:100%;max-height:75vh;display:flex;align-items:center;justify-content:center}
.lb img,.lb video{max-width:100%;max-height:75vh;border-radius:12px;display:block}
.lb .cap{color:#fff;font-weight:700;font-size:17px;text-align:center}
.lb .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:22px}
.lb a.pill{background:#fff;color:#111}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.thumb{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <div class="date" id="today"></div>
      <h1>Latihan</h1>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Menu: riwayat, kelola tabel, backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    </button>
  </header>

  <nav class="chips" id="chips" role="tablist" aria-label="Kategori latihan"></nav>

  <section class="hero" id="hero">
    <div class="ring" id="ring"><span id="ringTxt">0/0</span></div>
    <div class="info">
      <h2 id="catName"></h2>
      <p id="catSub"></p>
    </div>
    <button class="iconbtn" id="catMenuBtn" aria-label="Ubah kategori">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </section>

  <div class="filters" id="filters">
    <label class="fsel">
      <select id="fSub" aria-label="Filter sub-kategori"></select>
      <svg class="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <svg class="r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </label>
    <label class="fsel">
      <select id="fEquip" aria-label="Filter alat"></select>
      <svg class="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
      <svg class="r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </label>
    <button class="clearf" id="clearF" hidden>Reset</button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="bottom">
  <div class="inner">
    <button class="btn finish" id="finishBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span id="finishTxt">Selesai latihan</span>
    </button>
    <button class="btn primary" id="addExBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Gerakan
    </button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- sheet: exercise -->
<section class="sheet" id="exSheet" role="dialog" aria-modal="true" aria-labelledby="exTitle" hidden>
  <div class="grab"></div>
  <h3 id="exTitle">Tambah gerakan</h3>
  <form class="form" id="exForm" novalidate>
    <label class="field"><span>Nama gerakan</span><input id="exName" maxlength="60" placeholder="mis. Incline Bench Press" autocomplete="off"></label>
    <div class="grid2">
      <div class="field"><span>Sub-kategori</span>
        <div class="withadd"><select id="exSub" aria-label="Sub-kategori"></select><button type="button" class="plus" id="exSubPlus" aria-label="Tambah sub-kategori baru">+</button></div>
        <div class="quick" id="exSubQuick" hidden><input class="inp" id="exSubNew" maxlength="30" placeholder="mis. Upper Chest"><button type="button" class="btn soft small" id="exSubAdd">OK</button></div>
      </div>
      <div class="field"><span>Alat</span>
        <div class="withadd"><select id="exEquip" aria-label="Alat"></select><button type="button" class="plus" id="exEquipPlus" aria-label="Tambah alat baru">+</button></div>
        <div class="quick" id="exEquipQuick" hidden><input class="inp" id="exEquipNew" maxlength="30" placeholder="mis. EZ Bar"><button type="button" class="btn soft small" id="exEquipAdd">OK</button></div>
      </div>
    </div>
    <div class="grid3">
      <label class="field"><span>Set</span>
        <div class="stepper"><button type="button" data-step="-1" aria-label="Kurangi set">−</button><input id="exSets" inputmode="numeric" value="3" aria-label="Jumlah set"><button type="button" data-step="1" aria-label="Tambah set">+</button></div>
      </label>
      <label class="field"><span>Reps</span><input id="exReps" maxlength="12" placeholder="8-12"></label>
      <label class="field"><span>Beban</span><input id="exWeight" maxlength="14" placeholder="40 kg"></label>
    </div>
    <label class="field"><span>Link tutorial</span><input id="exLink" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://youtube.com/…"></label>

    <div class="field">
      <span class="flabel">Gambar / preview</span>
      <div class="seg" id="mSeg" role="group" aria-label="Sumber preview">
        <button type="button" data-m="auto" aria-pressed="true">Otomatis</button>
        <button type="button" data-m="link" aria-pressed="false">Link</button>
        <button type="button" data-m="file" aria-pressed="false">Foto</button>
      </div>
      <input class="inp" id="mLink" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="Link gambar, GIF, video .mp4, YouTube, atau Giphy" hidden>
      <label class="btn soft filebtn" id="mFileBtn" hidden>Pilih foto / GIF dari galeri<input type="file" id="mFile" accept="image/*"></label>
      <div class="mprev" id="mPrev"><div class="note">Tidak ada preview</div></div>
      <p class="hint" id="mHint"></p>
    </div>

    <label class="field"><span>Catatan</span><textarea id="exNote" maxlength="300" placeholder="mis. tempo 3 detik turun, istirahat 90 detik"></textarea></label>
    <p class="err" id="exErr" hidden></p>
    <div class="btnrow">
      <button type="button" class="btn soft" id="exCancel">Batal</button>
      <button type="submit" class="btn primary" id="exSave">Simpan</button>
    </div>
    <button type="button" class="btn danger" id="exDelete" hidden>Hapus gerakan</button>
  </form>
</section>

<!-- sheet: category -->
<section class="sheet" id="catSheet" role="dialog" aria-modal="true" aria-labelledby="catTitle" hidden>
  <div class="grab"></div>
  <h3 id="catTitle">Kategori baru</h3>
  <form class="form" id="catForm" novalidate>
    <label class="field"><span>Nama</span><input id="catNameIn" maxlength="30" placeholder="mis. Upper Body" autocomplete="off"></label>
    <div class="field"><span>Warna piringan</span><div class="colors" id="colors"></div></div>
    <p class="err" id="catErr" hidden></p>
    <div class="btnrow">
      <button type="button" class="btn soft" id="catCancel">Batal</button>
      <button type="submit" class="btn primary" id="catSave">Simpan</button>
    </div>
  </form>
  <div id="catExtra" hidden>
    <div class="section-t">Lainnya</div>
    <div class="menu">
      <button type="button" id="catSubsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Sub-kategori</span><span class="sub" id="catSubsCnt"></span></button>
      <button type="button" id="reorderBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg><span>Atur urutan gerakan</span></button>
      <button type="button" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Hapus semua centang (tanpa simpan)</span></button>
      <button type="button" id="moveLeftBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Geser kategori ke kiri</span></button>
      <button type="button" class="danger" id="delCatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span id="delCatTxt">Hapus kategori</span></button>
    </div>
  </div>
</section>

  <h3 id="mtTitle">Kelola</h3>

  <div id="mtBody"></div>
  <div class="btnrow" style="margin-top:18px"><button type="button" class="btn soft" id="mtClose">Selesai</button></div>

<section class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>

  <h3 id="setTitle">Menu</h3>
  <div class="menu">
    <button type="button" id="openSubs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Kelola sub-kategori</span><span class="sub" id="subsCnt"></span></button>
    <button type="button" id="openEquip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Kelola alat</span><span class="sub" id="equipCnt"></span></button>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  const APP_VERSION = '2.0';
  const $ = id => document.getElementById(id);
  const KEY = 'latihan.v1';                 // kunci tetap sama supaya data lama terbaca
  const PLATES = [
    { key:'red', label:'25' }, { key:'blue', label:'20' }, { key:'yellow', label:'15' },
    { key:'green', label:'10' }, { key:'white', label:'5' }, { key:'black', label:'' }
  ];
  const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const cvar = k => 'var(--p-' + k + ')';
  const cink = k => (k === 'yellow' || k === 'white') ? '#16181B' : '#FFFFFF';
  const fmtDate = iso => { const d = new Date(iso); return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()]; };
  const str = s => String(s ?? '');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // ---------- data awal (bisa diubah/dihapus semua lewat menu Kelola) ----------
  const SEED_SUBS = {
    push: ['Chest', 'Shoulder', 'Tricep'],
    pull: ['Back', 'Bicep', 'Rear Delt'],
    leg:  ['Quads', 'Hamstring', 'Glutes', 'Calves']
  };
  const SEED_EQUIP = ['Barbell', 'Dumbbell', 'Cable', 'Machine', 'Smith Machine', 'Bodyweight', 'Kettlebell', 'Resistance Band'];

  function seedSubsFor(cat){
    const n = cat.name.toLowerCase();
    const key = n.includes('push') ? 'push' : n.includes('pull') ? 'pull' : (n.includes('leg') || n.includes('kaki')) ? 'leg' : null;
    return key ? SEED_SUBS[key].map(name => ({ id: uid(), categoryId: cat.id, name })) : [];
  }
  function starter(){
    const cats = [
      { id: uid(), name:'Push Day', color:'red', lastDone:null, exercises:[] },
      { id: uid(), name:'Pull Day', color:'blue', lastDone:null, exercises:[] },
      { id: uid(), name:'Leg Day', color:'yellow', lastDone:null, exercises:[] }
    ];
    return { version: 2, activeId: cats[0].id, categories: cats, history: [],
             subcategories: cats.flatMap(seedSubsFor),
             equipment: SEED_EQUIP.map(name => ({ id: uid(), name })) };
  }
  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.categories)) return sanitize(d); }
    } catch(_){}
    return starter();
  }
  // Validasi + migrasi data versi 1 -> 2 (tambah tabel sub-kategori & alat, field baru di gerakan)
  function sanitize(d){
    const fromV1 = !Array.isArray(d.subcategories);
    d.history = Array.isArray(d.history) ? d.history : [];
    d.categories.forEach(c => {
      c.id = c.id || uid(); c.name = str(c.name).slice(0,30) || 'Kategori';
      c.color = PLATES.some(p => p.key === c.color) ? c.color : 'red';
      c.exercises = Array.isArray(c.exercises) ? c.exercises : [];
    });
    if (fromV1) d.subcategories = d.categories.flatMap(seedSubsFor);
    if (!Array.isArray(d.equipment)) d.equipment = SEED_EQUIP.map(name => ({ id: uid(), name }));
    const catIds = new Set(d.categories.map(c => c.id));
    d.subcategories = d.subcategories.filter(s => s && catIds.has(s.categoryId)).map(s => ({ id: s.id || uid(), categoryId: s.categoryId, name: str(s.name).slice(0,30) || 'Sub-kategori' }));
    d.equipment = d.equipment.filter(Boolean).map(e => ({ id: e.id || uid(), name: str(e.name).slice(0,30) || 'Alat' }));
    const subIds = new Set(d.subcategories.map(s => s.id)), eqIds = new Set(d.equipment.map(e => e.id));
    d.categories.forEach(c => c.exercises.forEach(e => {
      e.id = e.id || uid(); e.sets = Math.min(20, Math.max(1, parseInt(e.sets,10) || 1));
      e.done = Array.from({ length: e.sets }, (_, i) => !!(e.done && e.done[i]));
      ['name','reps','weight','link','note'].forEach(k => e[k] = str(e[k]));
      e.subId = subIds.has(e.subId) && d.subcategories.find(s => s.id === e.subId).categoryId === c.id ? e.subId : null;
      e.equipId = eqIds.has(e.equipId) ? e.equipId : null;
      e.media = (e.media && (e.media.type === 'link' || e.media.type === 'file') && e.media.value) ? { type: e.media.type, value: str(e.media.value) } : null;
    }));
    d.version = 2;
    if (!catIds.has(d.activeId)) d.activeId = d.categories[0]?.id || null;
    return d;
  }
  let state = load();
  let saveOk = true;
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); saveOk = true; }
    catch(_){ if (saveOk) toast('Gagal menyimpan di HP ini. Coba buka dari Home Screen.'); saveOk = false; }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

  const active = () => state.categories.find(c => c.id === state.activeId) || null;
  const subsOf = catId => state.subcategories.filter(s => s.categoryId === catId);
  const subById = id => state.subcategories.find(s => s.id === id) || null;
  const eqById = id => state.equipment.find(e => e.id === id) || null;
  const allExercises = () => state.categories.flatMap(c => c.exercises);
  const isDone = e => e.done.length > 0 && e.done.every(Boolean);
  const touched = c => c && c.exercises.some(e => e.done.some(Boolean));

  // ---------- foto dari galeri: disimpan di IndexedDB (di HP) ----------
  const idb = (() => {
    let p;
    const open = () => p || (p = new Promise((res, rej) => {
      const r = indexedDB.open('latihan-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('files', mode); const s = t.objectStore('files'); const out = fn(s);
      t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
    return {
      put: (id, blob) => tx('readwrite', s => s.put(blob, id)),
      get: id => tx('readonly', s => s.get(id)),
      del: id => tx('readwrite', s => s.delete(id)),
      keys: () => tx('readonly', s => s.getAllKeys())
    };
  })();
  const fileURLs = new Map();
  async function loadFileURL(id){
    if (fileURLs.has(id)) return fileURLs.get(id);
    try { const b = await idb.get(id); if (b){ const u = URL.createObjectURL(b); fileURLs.set(id, u); return u; } } catch(_){}
    return null;
  }
  async function preloadFiles(){
    const ids = allExercises().filter(e => e.media && e.media.type === 'file').map(e => e.media.value);
    await Promise.all(ids.map(loadFileURL));
  }
  async function dropFile(id){ try { await idb.del(id); } catch(_){} const u = fileURLs.get(id); if (u){ URL.revokeObjectURL(u); fileURLs.delete(id); } }

  // ---------- media dari link ----------
  function ytId(url){
    try {
      const u = new URL(url); const h = u.hostname.replace(/^www\.|^m\./,'');
      if (h === 'youtu.be') return u.pathname.slice(1).split('/')[0] || null;
      if (h.endsWith('youtube.com')){
        if (u.searchParams.get('v')) return u.searchParams.get('v');
        const m = u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{6,})/); return m ? m[2] : null;
      }
    } catch(_){}
    return null;
  }
  function classify(url){
    if (!url) return null;
    const yt = ytId(url);
    if (yt) return { kind:'yt', src:'https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg', href:url };
    try {
      const u = new URL(url); const h = u.hostname.replace(/^www\./,''); const path = u.pathname.toLowerCase();
      if (h === 'giphy.com' && /\/gifs\//.test(path)){ const id = u.pathname.split('/').pop().split('-').pop(); if (id) return { kind:'img', src:'https://media.giphy.com/media/' + id + '/giphy.gif' }; }
      if (/\.(mp4|webm|mov|m4v)$/.test(path)) return { kind:'video', src:url };
    } catch(_){ return null; }
    return { kind:'img', src:url };
  }
  function mediaFor(ex){
    if (ex.media && ex.media.type === 'file'){ const u = fileURLs.get(ex.media.value); return u ? { kind:'img', src:u } : { kind:'missing' }; }
    if (ex.media && ex.media.type === 'link') return classify(ex.media.value);
    if (ex.link && ytId(ex.link)) return classify(ex.link);   // otomatis: thumbnail YouTube dari link tutorial
    return null;
  }

  // ---------- toast ----------
  let tt; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- render ----------
  let reorder = false;
  const filter = { sub:'', equip:'' };
  function render(){
    const d = new Date(); $('today').textContent = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()];
    renderChips(); renderHero(); renderFilters(); renderList(); renderBottom();
  }
  function renderChips(){
    const box = $('chips'); box.replaceChildren();
    state.categories.forEach(c => {
      const b = el('button','chip'); b.setAttribute('role','tab');
      b.style.setProperty('--c', cvar(c.color)); b.style.setProperty('--ci', cink(c.color));
      b.setAttribute('aria-selected', String(c.id === state.activeId));
      const done = c.exercises.filter(isDone).length;
      b.append(el('span','plate'), el('span',null,c.name), el('span','cnt', done ? done + '/' + c.exercises.length : String(c.exercises.length)));
      b.addEventListener('click', () => { state.activeId = c.id; reorder = false; filter.sub = ''; save(); render(); });
      box.append(b);
    });
    const add = el('button','chip add','+ Kategori'); add.addEventListener('click', () => openCat(null)); box.append(add);
    const sel = box.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block:'nearest', inline:'nearest' });
  }
  function renderHero(){
    const c = active(); const hero = $('hero');
    if (!c){ hero.hidden = true; return; }
    hero.hidden = false;
    document.documentElement.style.setProperty('--c', cvar(c.color));
    document.documentElement.style.setProperty('--ci', cink(c.color));
    const total = c.exercises.length, done = c.exercises.filter(isDone).length;
    $('ring').style.setProperty('--p', total ? done / total : 0);
    $('ringTxt').textContent = done + '/' + total;
    $('catName').textContent = c.name;
    const setsTotal = c.exercises.reduce((s,e) => s + e.sets, 0), setsDone = c.exercises.reduce((s,e) => s + e.done.filter(Boolean).length, 0);
    let sub = total ? setsDone + ' dari ' + setsTotal + ' set' : 'Belum ada gerakan';
    if (c.lastDone) sub += ' · terakhir ' + fmtDate(c.lastDone);
    $('catSub').textContent = sub;
  }
  function fillSelect(sel, items, value, allLabel){
    sel.replaceChildren();
    if (allLabel !== undefined){ const o = el('option', null, allLabel); o.value = ''; sel.append(o); }
    items.forEach(([v, l]) => { const o = el('option', null, l); o.value = v; sel.append(o); });
    sel.value = items.some(([v]) => v === value) ? value : '';
  }
  function renderFilters(){
    const c = active(); $('filters').hidden = !c || !c.exercises.length || reorder;
    if (!c) return;
    const cnt = (pred) => c.exercises.filter(pred).length;
    const subs = subsOf(c.id).map(s => [s.id, s.name + ' (' + cnt(e => e.subId === s.id) + ')']);
    if (cnt(e => !e.subId)) subs.push(['none', 'Tanpa sub-kategori (' + cnt(e => !e.subId) + ')']);
    const eqs = state.equipment.filter(q => cnt(e => e.equipId === q.id)).map(q => [q.id, q.name + ' (' + cnt(e => e.equipId === q.id) + ')']);
    if (cnt(e => !e.equipId)) eqs.push(['none', 'Tanpa alat (' + cnt(e => !e.equipId) + ')']);
    fillSelect($('fSub'), subs, filter.sub, 'Sub-kategori');
    fillSelect($('fEquip'), eqs, filter.equip, 'Alat');
    filter.sub = $('fSub').value; filter.equip = $('fEquip').value;
    $('fSub').classList.toggle('on', !!filter.sub); $('fEquip').classList.toggle('on', !!filter.equip);
    $('clearF').hidden = !filter.sub && !filter.equip;
  }
  $('fSub').addEventListener('change', e => { filter.sub = e.target.value; render(); });
  $('fEquip').addEventListener('change', e => { filter.equip = e.target.value; render(); });
  $('clearF').addEventListener('click', () => { filter.sub = ''; filter.equip = ''; render(); });

  const ICON = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>'
  };
  function linkLabel(url){
    try { const h = new URL(url).hostname.replace(/^www\.|^m\./,''); return /youtu/.test(h) ? 'YouTube' : /tiktok/.test(h) ? 'TikTok' : /instagram/.test(h) ? 'Instagram' : h; }
    catch(_){ return 'Tutorial'; }
  }
  function mediaNode(m, forThumb){
    if (!m || m.kind === 'missing'){ const s = el('span','ph'); s.innerHTML = ICON.image; return s; }
    let node;
    if (m.kind === 'video'){
      node = document.createElement('video'); node.muted = true; node.playsInline = true; node.setAttribute('playsinline','');
      node.preload = 'metadata'; node.src = m.src + (forThumb ? '#t=0.1' : '');
      if (!forThumb){ node.controls = true; node.autoplay = true; node.loop = true; }
    } else {
      node = document.createElement('img'); node.src = m.src; node.alt = ''; node.loading = 'lazy'; node.decoding = 'async';
    }

  function mtRow(kind, item, list){
    const row = el('div','mt-row');
    const inp = el('input'); inp.value = item.name; inp.maxLength = 30; inp.setAttribute('aria-label','Nama ' + item.name);
    inp.addEventListener('change', () => { const v = inp.value.trim(); if (v){ item.name = v; save(); render(); } else inp.value = item.name; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    const n = usage(kind, item.id);
    const idx = list.indexOf(item);
    const up = el('button','mv'); up.innerHTML = moveSvg(-1); up.disabled = idx === 0; up.setAttribute('aria-label','Naikkan ' + item.name);
    const dn = el('button','mv'); dn.innerHTML = moveSvg(1); dn.disabled = idx === list.length - 1; dn.setAttribute('aria-label','Turunkan ' + item.name);
    const arr = kind === 'sub' ? state.subcategories : state.equipment;
    up.addEventListener('click', () => { swapIn(arr, item, list[idx-1]); save(); renderMaster(); render(); });
    dn.addEventListener('click', () => { swapIn(arr, item, list[idx+1]); save(); renderMaster(); render(); });
    const armed = mtArmed === item.id;
    const del = el('button','del' + (armed ? ' armed' : ''), armed ? (n ? 'Hapus? ' + n + ' gerakan dilepas' : 'Yakin?') : 'Hapus');
    del.addEventListener('click', () => {
      if (mtArmed !== item.id){ mtArmed = item.id; renderMaster(); return; }
      mtArmed = null;
      if (kind === 'sub'){ state.subcategories = state.subcategories.filter(s => s !== item); allExercises().forEach(e => { if (e.subId === item.id) e.subId = null; }); if (filter.sub === item.id) filter.sub = ''; }
      else { state.equipment = state.equipment.filter(q => q !== item); allExercises().forEach(e => { if (e.equipId === item.id) e.equipId = null; }); if (filter.equip === item.id) filter.equip = ''; }
      save(); renderMaster(); render();
    });
    row.append(inp, el('span','cnt', n + ' gerakan'), up, dn, del);
    return row;
  }
  function mtAdder(placeholder, onAdd){
    const f = el('form','mt-add'); const inp = el('input','inp'); inp.placeholder = placeholder; inp.maxLength = 30;
    const b = el('button','btn soft small','Tambah'); b.type = 'submit';
    f.append(inp, b);
    f.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; onAdd(v); save(); renderMaster(); render(); toast(v + ' ditambahkan'); });
    return f;
  }
  function renderMaster(){
    const body = $('mtBody'); body.replaceChildren();
    if (mtKind === 'sub'){
      const cats = mtFocusCat ? state.categories.filter(c => c.id === mtFocusCat).concat(state.categories.filter(c => c.id !== mtFocusCat)) : state.categories;
      if (!cats.length) body.append(el('p','hint','Buat kategori dulu.'));
      cats.forEach(c => {
        const g = el('div','mt-group'); const h = el('h4'); const p = el('span','plate'); p.style.setProperty('--c', cvar(c.color));
        h.append(p, document.createTextNode(c.name)); g.append(h);
        const list = subsOf(c.id); const rows = el('div','mt-rows');
        if (!list.length) rows.append(el('div','mt-empty','Belum ada sub-kategori'));
        list.forEach(s => rows.append(mtRow('sub', s, list)));
        g.append(rows, mtAdder('Tambah ke ' + c.name, v => state.subcategories.push({ id: uid(), categoryId: c.id, name: v })));
        body.append(g);
      });
    } else {
      const g = el('div','mt-group'); const rows = el('div','mt-rows'); const list = state.equipment.slice();
      if (!list.length) rows.append(el('div','mt-empty','Belum ada alat'));
      list.forEach(q => rows.append(mtRow('eq', q, list)));
      g.append(rows, mtAdder('Alat baru, mis. EZ Bar', v => state.equipment.push({ id: uid(), name: v })));
      body.append(g);
    }
  }
  $('mtClose').addEventListener('click', hide);

  // ---------- menu / riwayat / backup ----------
  function renderHistory(){
    const ul = $('hist'); ul.replaceChildren();
    if (!state.history.length){ const li = el('li',null,'Belum ada. Tekan “Selesai latihan” setelah selesai di gym.'); li.style.color = 'var(--muted)'; ul.append(li); return; }
    state.history.slice(0, 30).forEach(h => {
      const li = el('li'); li.append(el('span',null,h.category + ' · ' + h.done + '/' + h.total + ' gerakan, ' + h.sets + ' set'), el('span','d',fmtDate(h.date)));
      ul.append(li);
    });
  }
  $('openSettings').addEventListener('click', async () => {
    renderHistory();
    $('subsCnt').textContent = state.subcategories.length; $('equipCnt').textContent = state.equipment.length;
    let info = '';
    try { if (navigator.storage && navigator.storage.persisted) info = (await navigator.storage.persisted()) ? 'Penyimpanan permanen aktif.' : ''; } catch(_){}
    const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (!standalone) info += (info ? ' ' : '') + 'Tip: pasang ke Home Screen (Share → Add to Home Screen) agar bisa dibuka offline seperti aplikasi.';
    $('storageInfo').textContent = info;
    $('verInfo').textContent = 'Versi ' + APP_VERSION;
    show($('setSheet'));
  });
  $('openSubs').addEventListener('click', () => openMaster('sub', state.activeId));
  $('openEquip').addEventListener('click', () => openMaster('eq'));
  $('setClose').addEventListener('click', hide);

  const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
  $('exportBtn').addEventListener('click', async () => {
    const d = new Date(); const name = 'latihan-backup-' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.json';
    const media = {};
    for (const e of allExercises()){
      if (e.media && e.media.type === 'file'){ try { const b = await idb.get(e.media.value); if (b) media[e.media.value] = await blobToDataURL(b); } catch(_){} }
    }
    const blob = new Blob([JSON.stringify(Object.assign({}, state, { media, exportedAt: d.toISOString(), appVersion: APP_VERSION }))], { type:'application/json' });
    try {
      const file = new File([blob], name, { type:'application/json' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'Backup Latihan' }); return; }
    } catch(err){ if (err && err.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $('importIn').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.categories)) throw 0;
        const media = d.media && typeof d.media === 'object' ? d.media : {};
        delete d.media; delete d.exportedAt; delete d.appVersion;
        for (const [id, dataURL] of Object.entries(media)){
          try { const b = await (await fetch(dataURL)).blob(); await idb.put(id, b); const old = fileURLs.get(id); if (old) URL.revokeObjectURL(old); fileURLs.delete(id); } catch(_){}
        }
        state = sanitize(d); save(); await preloadFiles(); filter.sub = ''; filter.equip = '';
        hide(); render();
        toast('Backup dipulihkan: ' + state.categories.length + ' kategori');
      } catch(_){ toast('File bukan backup Latihan yang valid'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  // ---------- boot ----------
  save();                   // simpan hasil migrasi v1 -> v2
  render();
  preloadFiles().then(render);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
